    <title>Motrix</title>
    <script>
      (() => {
        const originalFetch = window.fetch;
        const showConnectionError = (request, reason) => {
          let box = document.getElementById('motrix-connection-detail');
          if (!box) {
            box = document.createElement('pre');
            box.id = 'motrix-connection-detail';
            box.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:2147483647;max-width:90vw;white-space:pre-wrap;overflow-wrap:anywhere;padding:10px;background:#fff3cd;color:#332700;border:1px solid #caa727;border-radius:6px;font:12px sans-serif';
            document.body.append(box);
          }
          box.textContent = `连接检查失败\n页面: ${location.href}\n请求: ${request}\n原因: ${reason}`;
        };
        window.fetch = function (input, init) {
          const request = typeof input === 'string' ? input : input.url;
          return originalFetch.apply(this, arguments).then(
            response => {
              if (request.includes('/rpc/auth/status') && !response.ok) {
                showConnectionError(request, `HTTP ${response.status}`);
              }
              return response;
            },
            error => {
              if (request.includes('/rpc/auth/status')) {
                showConnectionError(request, `${error.name}: ${error.message}`);
              }
              throw error;
            }
          );
        };
      })();
    </script>

  <body>
    <div id="motrix-plugin-root"></div>
    <script>
      (() => {
        // Motrix dialogs are portaled outside the micro-app root. The NAS host
        // applies a -50% Y translate to the thumb after our theme CSS loads.
        if (!document.getElementById('motrix-switch-center')) {
          const style = document.createElement('style');
          style.id = 'motrix-switch-center';
          style.textContent = `
            [data-slot="dialog-content"] [role="switch"][aria-checked="true"] [data-slot="switch-thumb"] {
              translate: calc(100% - 2px) 0 !important;
            }
            [data-slot="dialog-content"] [role="switch"][aria-checked="false"] [data-slot="switch-thumb"] {
              translate: 0 0 !important;
            }
          `;
          document.head.append(style);
        }
        const centerSwitchThumbs = () => {
          document.querySelectorAll('[data-slot="dialog-content"] [role="switch"]').forEach(track => {
            const thumb = track.querySelector('[data-slot="switch-thumb"]');
            if (!thumb) return;
            const translate = track.getAttribute('aria-checked') === 'true'
              ? 'calc(100% - 2px) 0'
              : '0 0';
            if (thumb.style.getPropertyValue('translate') !== translate ||
                thumb.style.getPropertyPriority('translate') !== 'important') {
              thumb.style.setProperty('translate', translate, 'important');
            }
          });
        };
        document.__motrixSwitchObserver?.disconnect();
        document.__motrixSwitchObserver = new MutationObserver(centerSwitchThumbs);
        document.__motrixSwitchObserver.observe(document.documentElement, {
          subtree: true,
          childList: true,
          attributes: true,
          attributeFilter: ['aria-checked'],
        });
        centerSwitchThumbs();
        const root = document.getElementById('motrix-plugin-root');
        const host = root.closest('#motrix') || root.closest('micro-app');
        if (!host) return;
        const fitToPluginWindow = () => {
          const contentTop = root.getBoundingClientRect().top;
          const height = Math.round(host.getBoundingClientRect().bottom - contentTop);
          if (height <= 200) return;
          root.style.height = `${height}px`;
          // Motrix portals dialogs into the NAS document. Center them in the
          // plugin content area so controls do not land under the host titlebar.
          const centerY = Math.round(contentTop + height / 2);
          host.querySelectorAll('[data-slot="dialog-content"]').forEach(dialog => {
            dialog.style.setProperty('top', `${centerY}px`, 'important');
            dialog.style.setProperty('max-height', `${height - 20}px`, 'important');
            dialog.style.setProperty('overflow-y', 'auto', 'important');
          });
        };
        fitToPluginWindow();
        document.__motrixDialogObserver?.disconnect();
        document.__motrixDialogObserver = new MutationObserver(fitToPluginWindow);
        document.__motrixDialogObserver.observe(host, { subtree: true, childList: true });
        if (typeof ResizeObserver === 'function') {
          new ResizeObserver(fitToPluginWindow).observe(host);
        }
        window.addEventListener('resize', fitToPluginWindow);
      })();
    </script>
