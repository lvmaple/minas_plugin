# pcbackup Nginx 反代规则（文件上传必须配置！）
# ⚠️ 必须位于 plugincenter.conf 中 location /plugin（前缀）之前，否则会被截胡！
#
# 兼容两种前缀：
#   /plugin/<uid>/pcbackup/...
#   /plugin/u<uid>/pcbackup/...
#
# 与 sysmon 的规则相比，额外加大了：
#   client_max_body_size  —— 允许单个分块（默认 8MiB）通过
#   proxy_read_timeout    —— 大文件/慢速网络下避免中断
#   proxy_request_buffering off —— 请求体直通后端，不在 nginx 落盘缓存

location ~ ^/plugin/u?<UID>/pcbackup/api/ {
  rewrite ^/plugin/u?<UID>/pcbackup/(api/.*)$ /$1 break;
  proxy_pass http://127.0.0.1:9303;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_http_version 1.1;
  client_max_body_size 256m;
  proxy_request_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  add_header Access-Control-Allow-Origin "*" always;
  add_header Cache-Control "no-store";
}
