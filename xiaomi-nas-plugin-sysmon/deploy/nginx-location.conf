# sysmon Nginx 反代规则
# ⚠️ 必须追加在 plugincenter.conf 文件顶部，
#    且位于 location /plugin（前缀）之前，否则会被截胡！
#
# 兼容两种前缀：
#   /plugin/<NAS_UID>/sysmon/...
#   /plugin/u<NAS_UID>/sysmon/...
# 安装前将 __NAS_UID__ 替换为实际数字 UID。
#
# 场景 A（推荐）：仅反代 /api/* 给本地服务，UI 走 plugin.cgi 静态服务

location ~ ^/plugin/u?__NAS_UID__/sysmon/api/ {
  rewrite ^/plugin/u?__NAS_UID__/sysmon/(api/.*)$ /$1 break;
  proxy_pass http://127.0.0.1:9301;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_http_version 1.1;
  add_header Access-Control-Allow-Origin "*" always;
  add_header Cache-Control "no-store";
}

# ── 可选：如需完全劫持 UI（绕过 plugin.cgi 登录态）请改用场景 C ──
# location ~ ^/plugin/u?__NAS_UID__/sysmon/((?!api/).*)$ {
#   alias /data/plugin/www/u__NAS_UID__/sysmon/$1;
#   default_type text/html;
# }
